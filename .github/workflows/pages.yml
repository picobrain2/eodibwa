name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # KR: every 12 hours (00:00, 12:00 UTC)
    - cron: "0 */12 * * *"
    # Overseas: daily at 15:00 UTC (00:00 KST)
    - cron: "0 15 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}
      VITE_OMDB_KEY: ${{ secrets.VITE_OMDB_KEY }}
      VITE_MOTN_KEY: ${{ secrets.VITE_MOTN_KEY }}
      VITE_KMDB_KEY: ${{ secrets.VITE_KMDB_KEY }}
      RECOMMEND_BUNDLE_BASE_URL: https://picobrain2.github.io/eodibwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure recommendation data step
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(date -u +%H)" = "15" ]; then
              echo "PREGENERATE_REGIONS=US,JP,TW,HK,GB" >> "$GITHUB_ENV"
            else
              echo "PREGENERATE_REGIONS=KR" >> "$GITHUB_ENV"
            fi
            echo "RECOMMEND_DATA_STEP=pregenerate" >> "$GITHUB_ENV"
          else
            echo "RECOMMEND_DATA_STEP=merge" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - name: Prepare recommendation JSON
        run: |
          if [ "$RECOMMEND_DATA_STEP" = "pregenerate" ]; then
            npm run pregenerate
          else
            npm run merge-recommendations
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
